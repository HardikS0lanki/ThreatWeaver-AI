name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate example
        run: PYTHONPATH=src python -m threatweaver validate examples/sample-model.json
      - name: Render example report
        run: PYTHONPATH=src python -m threatweaver report examples/sample-model.json --output /tmp/threat-model.md
